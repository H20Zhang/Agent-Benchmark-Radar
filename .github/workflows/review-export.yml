name: Export review source
on:
  push:
    branches: [fix/audit-complete-20260906]
    paths: [.github/workflows/review-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > /tmp/review-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: /tmp/review-source.tar.gz
          retention-days: 1
