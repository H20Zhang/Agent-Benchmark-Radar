name: One-off exact-title citation fallback

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: github.event.issue.title == 'trigger-benchmark-citation-title-fallback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add conservative ACL title fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/update_citations.py')
          text = path.read_text(encoding='utf-8')

          old = '''import argparse
          import json
          import os
          import re
          import sys
          import time
          from datetime import date
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          '''
          new = '''import argparse
          import html
          import json
          import os
          import re
          import sys
          import time
          from datetime import date
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode, urlsplit
          from urllib.request import Request, urlopen
          '''
          if old not in text:
              raise SystemExit('import block changed unexpectedly')
          text = text.replace(old, new, 1)

          old = '''S2_BATCH = "https://api.semanticscholar.org/graph/v1/paper/batch?fields=title,citationCount,url,externalIds"
          AREA_LABELS'''
          new = '''S2_BATCH = "https://api.semanticscholar.org/graph/v1/paper/batch?fields=title,citationCount,url,externalIds"
          S2_SEARCH = "https://api.semanticscholar.org/graph/v1/paper/search"
          AREA_LABELS'''
          if old not in text:
              raise SystemExit('S2 constant block changed unexpectedly')
          text = text.replace(old, new, 1)

          marker = '''def _refresh_citations(records: list[dict[str, object]], today: str) -> bool:
          '''
          helper = '''class _CitationTitleParser(HTMLParser):
              def __init__(self) -> None:
                  super().__init__()
                  self.title: str | None = None

              def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  if tag.lower() != "meta" or self.title is not None:
                      return
                  values = {key.lower(): value for key, value in attrs if key and value}
                  if values.get("name", "").lower() == "citation_title":
                      title = html.unescape(values.get("content", "")).strip()
                      self.title = title or None


          def _request_text(url: str) -> str:
              headers = {
                  "Accept": "text/html,application/xhtml+xml",
                  "User-Agent": "Agent-Benchmark-Radar/1.0 (+https://github.com/H20Zhang/Agent-Benchmark-Radar)",
              }
              request = Request(url, headers=headers, method="GET")
              delay = 2.0
              last_error: Exception | None = None
              for attempt in range(4):
                  try:
                      with urlopen(request, timeout=45) as response:
                          return response.read().decode("utf-8", errors="replace")
                  except HTTPError as exc:
                      last_error = exc
                      if exc.code not in {429, 500, 502, 503, 504} or attempt == 3:
                          raise
                  except URLError as exc:
                      last_error = exc
                      if attempt == 3:
                          raise
                  time.sleep(delay)
                  delay *= 2
              assert last_error is not None
              raise last_error


          def _normalized_title(value: str) -> str:
              return " ".join(re.sub(r"[\\W_]+", " ", html.unescape(value).casefold()).split())


          def _s2_title_fallback(record: dict[str, object]) -> dict[str, object] | None:
              artifacts = record.get("artifacts")
              if not isinstance(artifacts, dict):
                  return None
              paper_url = artifacts.get("paper")
              if not isinstance(paper_url, str) or not urlsplit(paper_url).netloc.lower().endswith("aclanthology.org"):
                  return None

              parser = _CitationTitleParser()
              parser.feed(_request_text(paper_url))
              if not parser.title:
                  return None
              target = _normalized_title(parser.title)
              query = urlencode(
                  {
                      "query": parser.title,
                      "limit": 5,
                      "fields": "title,citationCount,url,externalIds",
                  }
              )
              response = _request_json(f"{S2_SEARCH}?{query}")
              if not isinstance(response, dict) or not isinstance(response.get("data"), list):
                  return None
              matches = [
                  candidate
                  for candidate in response["data"]
                  if isinstance(candidate, dict)
                  and isinstance(candidate.get("title"), str)
                  and _normalized_title(candidate["title"]) == target
              ]
              if len(matches) == 1:
                  return matches[0]
              expected_doi = f"10.18653/v1/{urlsplit(paper_url).path.strip('/').split('/')[0]}".casefold()
              doi_matches = [
                  candidate
                  for candidate in matches
                  if isinstance(candidate.get("externalIds"), dict)
                  and str(candidate["externalIds"].get("DOI", "")).casefold() == expected_doi
              ]
              return doi_matches[0] if len(doi_matches) == 1 else None


          def _refresh_citations(records: list[dict[str, object]], today: str) -> bool:
          '''
          if marker not in text:
              raise SystemExit('refresh function marker changed unexpectedly')
          text = text.replace(marker, helper, 1)

          old = '''    for (record, _external_id), paper in zip(indexed, response):
                  if not isinstance(paper, dict):
                      desired = {
          '''
          new = '''    for (record, _external_id), paper in zip(indexed, response):
                  if not isinstance(paper, dict):
                      paper = _s2_title_fallback(record)
                  if not isinstance(paper, dict):
                      desired = {
          '''
          if old not in text:
              raise SystemExit('batch result loop changed unexpectedly')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Refresh citation counts
        run: python scripts/update_citations.py
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
      - name: Validate repository
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_reading.py
          git diff --check
      - name: Commit fix and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/oneoff-citation-title-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add exact-title citation fallback"
          git push origin HEAD:main
      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Exact-title citation fallback added, refreshed, and validated."
