name: Refresh benchmark citations
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_citations.py
      - scripts/refresh_citations_safe.py
      - .github/workflows/citations.yml
permissions:
  contents: write
concurrency:
  group: benchmark-citation-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refresh citations or explicitly retain the last verified snapshot
        run: python scripts/refresh_citations_safe.py
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
      - name: Validate canonical data and generated README
        run: |
          python -m unittest discover -s tests -v
          node scripts/render-readme.mjs --check
          python scripts/validate_reading.py
          git diff --check
      - name: Commit verified data and all reader projections together
        shell: bash
        run: |
          git add data/benchmarks.json README.md README.en.md library/evaluation-recipes.md library/evaluation-recipes.en.md library/results.md library/results.en.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refresh verified benchmark citations and README projections"
          git push origin HEAD:main
