name: Refresh benchmark citations

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_citations.py'

permissions:
  contents: write

concurrency:
  group: benchmark-citation-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh Semantic Scholar citation counts
        run: python scripts/update_citations.py
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
      - name: Validate repository
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_reading.py
          git diff --check
      - name: Commit refreshed counts
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/benchmarks.json README.md README.en.md
          git commit -m "refresh benchmark citation counts"
          git push origin HEAD:main
