# trigger
name: One-off front-page signal edit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-front-page-signals.yml']

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite front page and contract
        shell: python
        run: |
          from pathlib import Path

          zh_path = Path('README.md')
          en_path = Path('README.en.md')
          workflow_path = Path('docs/DAILY_WORKFLOW.md')

          zh = zh_path.read_text(encoding='utf-8')
          en = en_path.read_text(encoding='utf-8')

          anchor = '<a id="release-timeline"></a>'
          assert anchor in zh and anchor in en

          zh_rest = zh[zh.index(anchor):]
          en_rest = en[en.index(anchor):]

          zh_rest = zh_rest.replace(
              '## 最近半年 Benchmark 时间线\n\n这里按 benchmark / paper 的**原始发布时间**排序，而不是按 Radar 什么时候收录。窗口随 registry 中最近的核验日期滚动，向前覆盖六个月；只有月份精度的记录保留真实月份。表中不做精选，窗口内的基准全部列出。\n',
              '## 最近半年 Benchmark 时间线\n', 1)
          en_rest = en_rest.replace(
              "## Benchmark Timeline: Last Six Months\n\nThis is ordered by the benchmark/paper's **source release time**, not by when the Radar accepted it. The window rolls six months back from the registry's latest verification date; month-precision releases retain their honest precision. The table is complete for the window, not curated.\n",
              '## Benchmark Timeline: Last Six Months\n', 1)

          zh_prefix = '''# Agent Benchmark Radar

**中文** | [English](README.en.md)

<a id="frontier-signals"></a>
## 近 30 天：三个变化

<!-- FRONTIER-SIGNALS:START -->
| 方向 | 真正变化 | 代表 Benchmark |
|---|---|---|
| **Agent Memory** | 从“能不能召回”推进到**记忆是否因果改变后续行动，以及持久状态能否被安全治理**。PAST-Bench 用 persistence on/off 配对控制直接测 memory 的后续作用；SP-Mem 把 personalization、consent 与 leakage 放进同一协议；InMind 把 storage / knowledge / routing / use failure 拆开。 | [PAST-Bench](https://arxiv.org/abs/2608.04003) · [SP-Mem](https://arxiv.org/abs/2608.16551) · [InMind](https://arxiv.org/abs/2607.24368) |
| **RAG / Agentic Retrieval** | 重点从“recall 高不高”转向**retrieval metric 是否真的预测下游成功、搜索过程能否被审计、结果能否跨部署条件复现**。The Recall Trap 给出 recall 与 repair success 脱钩的直接反例；SearchAuditBench 测 failure localization / repair；The Commercial Tax 把 license、query format、index construction 与 cost 纳入可迁移性。 | [The Recall Trap](https://arxiv.org/abs/2608.14838) · [SearchAuditBench](https://arxiv.org/abs/2608.05212) · [The Commercial Tax](https://arxiv.org/abs/2608.16096) |
| **Data Agents** | 评价对象继续从“SQL / code 能跑”推到**先理解数据、再完成可验证工作，并在业务语义不清时正确追问或拒答**。Data Exploration Benchmark 把 exploration 单独计分；WarehouseReliabilityBench 测 business truth / clarification / abstention；data-eng-bench 的 evaluator 修复说明评测器本身也会成为可靠性瓶颈。 | [Data Exploration Benchmark](https://arxiv.org/abs/2608.16045) · [WarehouseReliabilityBench](https://arxiv.org/abs/2608.09254) · [data-eng-bench](https://github.com/Snowflake-Labs/data-eng-bench) |
<!-- FRONTIER-SIGNALS:END -->

最后更新：**2026-08-21**

'''
          en_prefix = '''# Agent Benchmark Radar

[中文](README.md) | **English**

<a id="frontier-signals"></a>
## Last 30 Days: Three Shifts

<!-- FRONTIER-SIGNALS:START -->
| Area | What actually changed | Representative benchmarks |
|---|---|---|
| **Agent Memory** | Evaluation is moving beyond “can it recall?” toward **whether retained memory causally changes later action and whether persistent state can be governed safely**. PAST-Bench uses persistence-on/off controls to measure downstream memory effects; SP-Mem puts personalization, consent, and leakage in one protocol; InMind separates storage, knowledge, routing, and use failures. | [PAST-Bench](https://arxiv.org/abs/2608.04003) · [SP-Mem](https://arxiv.org/abs/2608.16551) · [InMind](https://arxiv.org/abs/2607.24368) |
| **RAG / Agentic Retrieval** | The question is shifting from “is recall high?” to **whether a retrieval metric predicts downstream success, whether the search process is auditable, and whether results transfer across deployment conditions**. The Recall Trap gives a direct recall-vs-repair counterexample; SearchAuditBench measures failure localization and repair; The Commercial Tax brings license, query format, index construction, and cost into transferability. | [The Recall Trap](https://arxiv.org/abs/2608.14838) · [SearchAuditBench](https://arxiv.org/abs/2608.05212) · [The Commercial Tax](https://arxiv.org/abs/2608.16096) |
| **Data Agents** | The target keeps moving beyond “does SQL/code run?” toward **understanding data first, completing verifiable work, and clarifying or abstaining when business semantics are underspecified**. Data Exploration Benchmark scores exploration directly; WarehouseReliabilityBench tests business truth, clarification, and abstention; data-eng-bench's evaluator fix shows that evaluator reliability itself can be the bottleneck. | [Data Exploration Benchmark](https://arxiv.org/abs/2608.16045) · [WarehouseReliabilityBench](https://arxiv.org/abs/2608.09254) · [data-eng-bench](https://github.com/Snowflake-Labs/data-eng-bench) |
<!-- FRONTIER-SIGNALS:END -->

Last updated: **2026-08-21**

'''

          zh_path.write_text(zh_prefix + zh_rest, encoding='utf-8')
          en_path.write_text(en_prefix + en_rest, encoding='utf-8')

          workflow = workflow_path.read_text(encoding='utf-8')
          needle = 'The public reader contract is **table-first, then synthesis**:\n\n'
          replacement = '''The public reader contract is **signal-first, then table-first**:\n\n0. **30-day frontier signal table** — the first visible research content after the language switch. Exactly three rows: Agent Memory, RAG / Agentic Retrieval, and Data Agents. Each row states one concrete research/evaluation shift supported by 2–3 representative benchmark links from the current window. It is synthesis, not a list of new papers: say compared to what changed, prefer falsifiable claims over slogans, and say `no material shift` rather than manufacture a trend. Do not put repository self-description, reading-time navigation, or comparison-rule prose before this table.\n'''
          assert needle in workflow
          workflow_path.write_text(workflow.replace(needle, replacement, 1), encoding='utf-8')

          test = r'''from pathlib import Path
import re
import unittest

ROOT = Path(__file__).resolve().parents[1]

class FrontPageSignalContractTest(unittest.TestCase):
    def test_signal_table_is_first_research_surface(self):
        cases = (
            ('README.md', '近 30 天：三个变化', ('Agent Memory', 'RAG / Agentic Retrieval', 'Data Agents')),
            ('README.en.md', 'Last 30 Days: Three Shifts', ('Agent Memory', 'RAG / Agentic Retrieval', 'Data Agents')),
        )
        for filename, heading, areas in cases:
            text = (ROOT / filename).read_text(encoding='utf-8')
            prefix = text[:text.index('<a id="release-timeline"></a>')]
            self.assertIn(heading, prefix)
            block = prefix.split('<!-- FRONTIER-SIGNALS:START -->', 1)[1].split('<!-- FRONTIER-SIGNALS:END -->', 1)[0]
            self.assertEqual(3, len([line for line in block.splitlines() if line.startswith('| **')]))
            for area in areas:
                self.assertIn(area, block)
            self.assertGreaterEqual(len(re.findall(r'\]\(https?://', block)), 9)

    def test_mechanical_intro_does_not_return(self):
        banned = {
            'README.md': ('默认入口', '先从这里理解', '[30 秒：', '> **比较规则：'),
            'README.en.md': ('The entry point to the Research Radar family', 'Start here to see', '[30 sec:', '> **Comparison rule.'),
        }
        for filename, phrases in banned.items():
            text = (ROOT / filename).read_text(encoding='utf-8')
            prefix = text[:text.index('<a id="release-timeline"></a>')]
            for phrase in phrases:
                self.assertNotIn(phrase, prefix)
'''
          Path('tests/test_front_page_signal_contract.py').write_text(test, encoding='utf-8')
      - name: Validate
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_reading.py
      - name: Commit result and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-front-page-signals.yml
          git add -- README.md README.en.md docs/DAILY_WORKFLOW.md tests/test_front_page_signal_contract.py
          git commit -m "docs: lead Benchmark Radar with research signals"
          git push origin HEAD:main
