name: Refresh Radar 2026-09-05
on:
  push:
    branches: [chatgpt/restore-content-site-20260905]
    paths: [.github/workflows/refresh-radar-20260905.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/restore-content-site-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply verified freshness backfill
        run: python scripts/refresh_radar_20260905.py
      - name: Validate repository
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_reading.py
          python scripts/validate_detail_pages.py
          python scripts/audit_detail_pages.py
      - name: Validate website
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run check
          npm run build
      - name: Commit generated content and remove one-off machinery
        run: |
          rm scripts/refresh_radar_20260905.py
          rm .github/workflows/refresh-radar-20260905.yml
          git config user.name 'Hao Zhang'
          git config user.email 'zhanghaowuda12@gmail.com'
          git add -A
          git commit -m 'content: restore site and refresh benchmark radar'
          git push origin HEAD:chatgpt/restore-content-site-20260905
