name: Apply verified README-first changes
on:
  push:
    branches: [readme-primary-20260906]
    paths: [.github/workflows/apply-readme-first.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply source delta with exact base and output checks
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path, PurePosixPath
          digest = lambda b: hashlib.sha256(b).hexdigest()
          encoded = ''.join(Path(f'.readme-transfer-{i}.txt').read_text().strip() for i in (1, 2))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert digest(raw) == '91ea960c4157ec2675cb7928d2515337a637fcc51ac8f67c70d24e532e649216', 'Payload mismatch'
          payload = json.loads(raw)
          def safe(name):
              p = PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] not in ('.git', '.github'), name
              return Path(name)
          for name, change in payload['files'].items():
              path = safe(name)
              before = path.read_bytes() if path.exists() else None
              assert (digest(before) if before is not None else None) == change['before'], f'Base changed: {name}'
              if 'content' in change:
                  after = change['content']
              else:
                  lines = before.decode('utf8').splitlines(keepends=True)
                  for start, end, text in reversed(change['edits']):
                      lines[start:end] = text.splitlines(keepends=True)
                  after = ''.join(lines)
              data = after.encode('utf8')
              assert digest(data) == change['after'], f'Output mismatch: {name}'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          subprocess.run(['node', 'scripts/render-readme.mjs'], check=True)
          for name, expected in payload['generated'].items():
              assert digest(safe(name).read_bytes()) == expected, f'Generated drift: {name}'
          paths = sorted(set(payload['files']) | set(payload['generated']))
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'docs: make bilingual README the primary benchmark reading interface'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:readme-primary-20260906'], check=True)
          print('Verified source and all six generated reader documents.')
          PY
