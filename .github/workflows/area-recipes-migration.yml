name: One-off area routing and evaluation recipes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/area-recipes-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply area routing and evaluation recipes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          ROOT = Path('.')

          def replace_marked(text: str, start: str, end: str, block: str) -> str:
              pattern = re.compile(re.escape(start) + r'.*?' + re.escape(end), re.S)
              if pattern.search(text):
                  return pattern.sub(block.strip(), text, count=1)
              raise RuntimeError(f'missing marked block: {start}')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f'missing replacement target: {label}')
              return text.replace(old, new, 1)

          def ensure_registry_anchor(text: str, heading: str, marker: str, anchor: str) -> str:
              tag = f'<a id="{anchor}"></a>'
              if tag in text:
                  return text
              pattern = re.compile(
                  rf'(?m)^(### {re.escape(heading)}\n\n<!-- {re.escape(marker)}:START -->)'
              )
              text, count = pattern.subn(tag + r'\n\1', text, count=1)
              if count != 1:
                  raise RuntimeError(f'could not place registry anchor {anchor}')
              return text

          zh_onboarding = textwrap.dedent(r'''
          <!-- ONBOARDING:START -->
          <div align="center">

          <h1>Agent Benchmark Radar</h1>

          <p><strong>追踪 Agent 评测正在变成什么，而不只是收集有哪些 Benchmark。</strong></p>

          <p>
          覆盖 <b>Agent Memory</b> · <b>RAG / Agentic Retrieval</b> · <b>Data Agents</b><br/>
          把最新 Benchmark 放回演化脉络：它多测了什么、相比什么、还漏了什么。
          </p>

          <p><strong>中文</strong> · <a href="README.en.md">English</a></p>

          <p>
          <a href="https://github.com/H20Zhang/Agent-Benchmark-Radar/actions/workflows/validate.yml"><img alt="Validation" src="https://github.com/H20Zhang/Agent-Benchmark-Radar/actions/workflows/validate.yml/badge.svg"></a>
          <a href="https://github.com/H20Zhang/Agent-Benchmark-Radar/stargazers"><img alt="GitHub stars" src="https://img.shields.io/github/stars/H20Zhang/Agent-Benchmark-Radar?style=flat"></a>
          <img alt="Last commit" src="https://img.shields.io/github/last-commit/H20Zhang/Agent-Benchmark-Radar?style=flat">
          </p>

          </div>

          ## 从这里开始

          **先选你的研究对象。** 三类 Benchmark 不再要求从同一条混合时间线进入；每个方向都有自己的演化脉络、Evaluation Recipes 和完整列表。

          | 方向 | 你通常想回答 | 先看脉络 | 配一套评测 | 看全部 |
          |---|---|---|---|---|
          | **Agent Memory** | 长期记忆能否被正确召回、更新并用于后续行动？多模态、安全和治理怎么测？ | [Memory Map](#benchmark-memory) | [Memory Recipes](#recipe-memory) | [全部 Memory Benchmark](#registry-memory) |
          | **RAG / Agentic Retrieval** | 系统能否找对证据、完成复杂搜索，并在动态语料和长轨迹下保持可靠？ | [Retrieval Map](#benchmark-rag) | [Retrieval Recipes](#recipe-rag) | [全部 Retrieval Benchmark](#registry-rag) |
          | **Data Agents** | Agent 能否完成 SQL、分析、数据科学与 ML engineering，并得到可核验结果？ | [Data Agent Map](#benchmark-data) | [Data Agent Recipes](#recipe-data) | [全部 Data Agent Benchmark](#registry-data) |

          **跨领域 / 还没确定从哪开始：** [按 claim 配一套 Evaluation Recipe](#evaluation-recipes) · [看近 30 天的变化](#frontier-signals) · [看最近半年新 Benchmark](#release-timeline)

          _收录标准：只纳入可复用的 benchmark / evaluation contribution；仅在已有 benchmark 上报告实验结果的论文不进入 registry。详见 [Curation](CURATION.md)。_

          ---
          <!-- ONBOARDING:END -->
          ''').strip()

          en_onboarding = textwrap.dedent(r'''
          <!-- ONBOARDING:START -->
          <div align="center">

          <h1>Agent Benchmark Radar</h1>

          <p><strong>Track how agent evaluation is evolving—not just which benchmarks exist.</strong></p>

          <p>
          Covers <b>Agent Memory</b> · <b>RAG / Agentic Retrieval</b> · <b>Data Agents</b><br/>
          Maps new benchmarks back to their lineage: what became measurable, compared with what, and what is still missing.
          </p>

          <p><a href="README.md">中文</a> · <strong>English</strong></p>

          <p>
          <a href="https://github.com/H20Zhang/Agent-Benchmark-Radar/actions/workflows/validate.yml"><img alt="Validation" src="https://github.com/H20Zhang/Agent-Benchmark-Radar/actions/workflows/validate.yml/badge.svg"></a>
          <a href="https://github.com/H20Zhang/Agent-Benchmark-Radar/stargazers"><img alt="GitHub stars" src="https://img.shields.io/github/stars/H20Zhang/Agent-Benchmark-Radar?style=flat"></a>
          <img alt="Last commit" src="https://img.shields.io/github/last-commit/H20Zhang/Agent-Benchmark-Radar?style=flat">
          </p>

          </div>

          ## Start Here

          **Choose your research object first.** The three benchmark families no longer require entering through one mixed timeline; each area has its own evolution map, evaluation recipes, and complete registry.

          | Area | Questions you are usually asking | Understand the lineage | Build an evaluation | Browse all |
          |---|---|---|---|---|
          | **Agent Memory** | Can long-term memory be recalled, updated, and used for later action? How should multimodal memory, safety, and governance be evaluated? | [Memory Map](#benchmark-memory) | [Memory Recipes](#recipe-memory) | [All Memory Benchmarks](#registry-memory) |
          | **RAG / Agentic Retrieval** | Can the system find the right evidence, perform complex search, and remain reliable under dynamic corpora and long trajectories? | [Retrieval Map](#benchmark-rag) | [Retrieval Recipes](#recipe-rag) | [All Retrieval Benchmarks](#registry-rag) |
          | **Data Agents** | Can an agent complete SQL, analytics, data-science, and ML-engineering work with verifiable results? | [Data Agent Map](#benchmark-data) | [Data Agent Recipes](#recipe-data) | [All Data Agent Benchmarks](#registry-data) |

          **Cross-area / not sure where to start:** [build an Evaluation Recipe from your claim](#evaluation-recipes) · [see the last 30 days of change](#frontier-signals) · [scan new benchmarks from the last six months](#release-timeline)

          _Scope: the registry includes reusable benchmark / evaluation contributions. Papers that only report results on existing benchmarks are out of scope. See [Curation](CURATION.md)._

          ---
          <!-- ONBOARDING:END -->
          ''').strip()

          zh_recipes = textwrap.dedent(r'''
          <!-- EVALUATION-RECIPES:START -->
          <a id="evaluation-recipes"></a>
          ## Evaluation Recipes：按你的 claim 配 Benchmark

          Benchmark 不是越多越好。先写清论文或系统想支持的 **claim**：`Core` 测主对象，`Complement` 补相邻的 validity gap，最后一列提醒这套结果**还不能推出什么**。这些是研究起点，不是固定标准答案。

          <a id="recipe-memory"></a>
          ### Agent Memory

          | 你想证明 | Core | Complement | 还不能直接证明 |
          |---|---|---|---|
          | **长期对话记忆与时间推理** | [LoCoMo](https://aclanthology.org/2024.acl-long.747/) | [LongMemEval](https://arxiv.org/abs/2410.10813) | 记住历史不等于历史经验能改善后续行动。 |
          | **状态更新与过期信息处理** | [StateMemBench](https://arxiv.org/abs/2608.19652) | [LongMemEval](https://arxiv.org/abs/2410.10813) · [membench (staleness)](https://github.com/Ps23102004/membench) | 仍难隔离 write / update / retrieval 哪一层真正导致结果。 |
          | **记忆是否改善后续行动** | [MemoryArena](https://arxiv.org/abs/2602.16313) | [PAST-Bench](https://arxiv.org/abs/2608.04003) · [Mem2ActBench](https://aclanthology.org/2026.acl-long.370/) | 行动收益不等价于大规模个人长期历史上的通用 memory quality。 |
          | **多模态长期记忆** | [MemEye](https://arxiv.org/abs/2605.15128) | [Mem-Gallery](https://aclanthology.org/2026.acl-long.1892/) · [WorldMemArena](https://arxiv.org/abs/2605.29341) | 对权限、污染、压缩等 memory lifecycle 完整性的覆盖仍有限。 |
          | **Memory 安全与生命周期治理** | [InjecMEM](https://arxiv.org/abs/2608.23471) | [Utility Under Attack](https://arxiv.org/abs/2608.21230) · [GateMem](https://arxiv.org/abs/2606.18829) · [The Compaction Cliff](https://arxiv.org/abs/2608.22752) | 安全套件不能替代一般 utility、recall 与 reasoning 评测。 |

          <a id="recipe-rag"></a>
          ### RAG / Agentic Retrieval

          | 你想证明 | Core | Complement | 还不能直接证明 |
          |---|---|---|---|
          | **推理密集型 Retrieval 质量** | [BRIGHT](https://arxiv.org/abs/2407.12883) | [BEIR](https://arxiv.org/abs/2104.08663) · [Bright-Pro](https://aclanthology.org/2026.acl-long.1705/) | 静态检索结果不能说明 live、迭代式 web search 的能力。 |
          | **Deep / long-horizon web search** | [BrowseComp](https://arxiv.org/abs/2504.12516) | [LiveBrowseComp](https://arxiv.org/abs/2605.28721) · [LoHoSearch](https://arxiv.org/abs/2606.12837) | 端到端成功率本身不能定位搜索轨迹到底在哪里失败。 |
          | **搜索轨迹诊断与工具策略** | [SearchAuditBench](https://arxiv.org/abs/2608.05212) | [AgenticRAGTracer](https://arxiv.org/abs/2602.19127) · [VAKRA](https://arxiv.org/abs/2608.12282) | 轨迹诊断不等价于广覆盖 live-web retrieval 或 corpus robustness。 |
          | **动态、可写、会反馈的语料** | [KBGym](https://arxiv.org/abs/2608.21829) | [Snapshot Compatibility Audit](https://arxiv.org/abs/2608.22856) · [RAG Collapse](https://arxiv.org/abs/2608.22118) | 这类结果不能替代传统静态 corpus 上的 retrieval-quality 评测。 |
          | **多模态搜索与视觉文档 Retrieval** | [VisDocAgentBench](https://arxiv.org/abs/2608.17889) | [MC-Search](https://arxiv.org/abs/2603.00873) · [MERRIN](https://arxiv.org/abs/2604.13418) | 不同 modality / tool interface 会强烈影响结果，不能直接横比 headline score。 |

          <a id="recipe-data"></a>
          ### Data Agents

          | 你想证明 | Core | Complement | 还不能直接证明 |
          |---|---|---|---|
          | **Text-to-SQL / Warehouse 任务能力** | [Spider 2.0](https://arxiv.org/abs/2411.07763) | [Spider](https://aclanthology.org/D18-1425/) · [WarehouseReliabilityBench](https://arxiv.org/abs/2608.09254) | SQL 成功不覆盖完整的数据理解、分析与交付工作流。 |
          | **端到端 Data Science Agent** | [DataSpace](https://arxiv.org/abs/2608.03451) | [DSAgentBench](https://arxiv.org/abs/2608.10366) · [DataClawBench](https://arxiv.org/abs/2605.02503) | 工作流完成率本身不能隔离统计建模是否正确。 |
          | **数据理解与自主探索** | [Data Exploration Benchmark](https://arxiv.org/abs/2608.16045) | [DataClawBench](https://arxiv.org/abs/2605.02503) · [AgenticDataBench](https://arxiv.org/abs/2607.01647) | 探索质量不等价于下游模型、因果结论或业务决策质量。 |
          | **统计与因果分析** | [CausalDS](https://arxiv.org/abs/2607.08093) | [StatABench](https://arxiv.org/abs/2606.22977) | 受控统计/因果任务不覆盖真实 warehouse、repo 与数据工程约束。 |
          | **长时程 ML Engineering / Research Improvement** | [MLE-bench](https://arxiv.org/abs/2410.07095) | [DeltaML-Bench](https://arxiv.org/abs/2608.19653) · [AI4AI-Bench](https://arxiv.org/abs/2608.20318) | ML improvement 不能说明 BI、warehouse semantics 或一般数据分析能力。 |

          > **使用原则：** Recipe 的目标是让实验组合与论文 claim 对齐，而不是追求 Benchmark 数量。真正做实验前，继续检查每个 Benchmark 的 protocol、confounders 和 coverage gap。

          ---
          <!-- EVALUATION-RECIPES:END -->
          ''').strip()

          en_recipes = textwrap.dedent(r'''
          <!-- EVALUATION-RECIPES:START -->
          <a id="evaluation-recipes"></a>
          ## Evaluation Recipes: Build the Suite from Your Claim

          More benchmarks are not automatically better. Start from the **claim** your paper or system needs to support: `Core` measures the primary object, `Complement` closes an adjacent validity gap, and the final column states what the suite **still does not establish**. These are research starting points, not fixed standards.

          <a id="recipe-memory"></a>
          ### Agent Memory

          | Claim you want to support | Core | Complement | What this still does not establish |
          |---|---|---|---|
          | **Long-term conversational memory and temporal reasoning** | [LoCoMo](https://aclanthology.org/2024.acl-long.747/) | [LongMemEval](https://arxiv.org/abs/2410.10813) | Remembering history does not establish that retained experience improves future action. |
          | **State update and stale-information handling** | [StateMemBench](https://arxiv.org/abs/2608.19652) | [LongMemEval](https://arxiv.org/abs/2410.10813) · [membench (staleness)](https://github.com/Ps23102004/membench) | The result still does not isolate which write, update, or retrieval component caused the outcome. |
          | **Memory improves later action** | [MemoryArena](https://arxiv.org/abs/2602.16313) | [PAST-Bench](https://arxiv.org/abs/2608.04003) · [Mem2ActBench](https://aclanthology.org/2026.acl-long.370/) | Action gains do not establish general memory quality over broad personal histories. |
          | **Multimodal long-term memory** | [MemEye](https://arxiv.org/abs/2605.15128) | [Mem-Gallery](https://aclanthology.org/2026.acl-long.1892/) · [WorldMemArena](https://arxiv.org/abs/2605.29341) | Coverage of access control, poisoning, and compaction across the memory lifecycle remains limited. |
          | **Memory security and lifecycle governance** | [InjecMEM](https://arxiv.org/abs/2608.23471) | [Utility Under Attack](https://arxiv.org/abs/2608.21230) · [GateMem](https://arxiv.org/abs/2606.18829) · [The Compaction Cliff](https://arxiv.org/abs/2608.22752) | A security suite does not replace general utility, recall, and reasoning evaluation. |

          <a id="recipe-rag"></a>
          ### RAG / Agentic Retrieval

          | Claim you want to support | Core | Complement | What this still does not establish |
          |---|---|---|---|
          | **Reasoning-intensive retrieval quality** | [BRIGHT](https://arxiv.org/abs/2407.12883) | [BEIR](https://arxiv.org/abs/2104.08663) · [Bright-Pro](https://aclanthology.org/2026.acl-long.1705/) | Static retrieval results do not establish live, iterative web-search capability. |
          | **Deep / long-horizon web search** | [BrowseComp](https://arxiv.org/abs/2504.12516) | [LiveBrowseComp](https://arxiv.org/abs/2605.28721) · [LoHoSearch](https://arxiv.org/abs/2606.12837) | End-to-end success alone does not localize where a search trajectory failed. |
          | **Search-trajectory diagnosis and tool policy** | [SearchAuditBench](https://arxiv.org/abs/2608.05212) | [AgenticRAGTracer](https://arxiv.org/abs/2602.19127) · [VAKRA](https://arxiv.org/abs/2608.12282) | Trajectory diagnostics do not establish broad live-web retrieval or corpus robustness. |
          | **Dynamic, writable, feedback-forming corpora** | [KBGym](https://arxiv.org/abs/2608.21829) | [Snapshot Compatibility Audit](https://arxiv.org/abs/2608.22856) · [RAG Collapse](https://arxiv.org/abs/2608.22118) | These results do not replace conventional retrieval-quality evaluation on a static corpus. |
          | **Multimodal search and visual-document retrieval** | [VisDocAgentBench](https://arxiv.org/abs/2608.17889) | [MC-Search](https://arxiv.org/abs/2603.00873) · [MERRIN](https://arxiv.org/abs/2604.13418) | Modality and tool interfaces strongly affect outcomes, so headline scores are not directly comparable across benchmarks. |

          <a id="recipe-data"></a>
          ### Data Agents

          | Claim you want to support | Core | Complement | What this still does not establish |
          |---|---|---|---|
          | **Text-to-SQL / warehouse task capability** | [Spider 2.0](https://arxiv.org/abs/2411.07763) | [Spider](https://aclanthology.org/D18-1425/) · [WarehouseReliabilityBench](https://arxiv.org/abs/2608.09254) | SQL success does not cover the full data-understanding, analysis, and delivery workflow. |
          | **End-to-end data-science agent** | [DataSpace](https://arxiv.org/abs/2608.03451) | [DSAgentBench](https://arxiv.org/abs/2608.10366) · [DataClawBench](https://arxiv.org/abs/2605.02503) | Workflow completion alone does not isolate statistical or modeling validity. |
          | **Data understanding and autonomous exploration** | [Data Exploration Benchmark](https://arxiv.org/abs/2608.16045) | [DataClawBench](https://arxiv.org/abs/2605.02503) · [AgenticDataBench](https://arxiv.org/abs/2607.01647) | Exploration quality is not equivalent to downstream model, causal, or business-decision quality. |
          | **Statistical and causal analysis** | [CausalDS](https://arxiv.org/abs/2607.08093) | [StatABench](https://arxiv.org/abs/2606.22977) | Controlled statistical/causal tasks do not cover real warehouse, repository, and data-engineering constraints. |
          | **Long-horizon ML engineering / research improvement** | [MLE-bench](https://arxiv.org/abs/2410.07095) | [DeltaML-Bench](https://arxiv.org/abs/2608.19653) · [AI4AI-Bench](https://arxiv.org/abs/2608.20318) | ML improvement does not establish BI, warehouse-semantics, or general analytics capability. |

          > **Usage rule:** A recipe exists to align the experimental suite with the paper's claim, not to maximize benchmark count. Before running experiments, inspect each benchmark's protocol, confounders, and coverage gap.

          ---
          <!-- EVALUATION-RECIPES:END -->
          ''').strip()

          for filename, onboarding, recipes in (
              ('README.md', zh_onboarding, zh_recipes),
              ('README.en.md', en_onboarding, en_recipes),
          ):
              path = ROOT / filename
              text = path.read_text(encoding='utf-8')
              text = replace_marked(text, '<!-- ONBOARDING:START -->', '<!-- ONBOARDING:END -->', onboarding)
              if '<!-- EVALUATION-RECIPES:START -->' in text:
                  text = replace_marked(
                      text,
                      '<!-- EVALUATION-RECIPES:START -->',
                      '<!-- EVALUATION-RECIPES:END -->',
                      recipes,
                  )
              else:
                  frontier = '<a id="frontier-signals"></a>'
                  if frontier not in text:
                      raise RuntimeError(f'{filename}: missing frontier anchor')
                  text = text.replace(frontier, recipes + '\n\n' + frontier, 1)
              text = ensure_registry_anchor(text, 'Agent Memory', 'TABLE-FIRST:AREA:agent-memory', 'registry-memory')
              text = ensure_registry_anchor(text, 'RAG / Agentic Retrieval', 'TABLE-FIRST:AREA:rag', 'registry-rag')
              text = ensure_registry_anchor(text, 'Data Agents', 'TABLE-FIRST:AREA:data-agent', 'registry-data')
              path.write_text(text, encoding='utf-8')

          # Curation: make decision support a stable public surface.
          path = ROOT / 'CURATION.md'
          text = path.read_text(encoding='utf-8')
          old = (
              'README starts with a compact **onboarding layer** for project identity and reader routing, '
              'followed by the **signal-first, table-first research surface**. The onboarding layer is navigation '
              'rather than research synthesis. “Time-first” means that the newest research is easiest to scan; it '
              'does **not** mean that Radar-maintenance timestamps replace the research chronology or that one card '
              'is rendered per paper. Keep onboarding stable and short: title, one-sentence value proposition, '
              'language switch, lightweight status badges, and a Start Here router to canonical anchors.'
          )
          new = (
              'README starts with a compact **onboarding layer** that routes readers by research area, followed by a '
              'small **Evaluation Recipes** decision-support layer, then the **signal-first, table-first research '
              'surface**. Onboarding and recipes are navigation/selection aids rather than research-trend synthesis. '
              '“Time-first” means that the newest research is easiest to scan; it does **not** mean that '
              'Radar-maintenance timestamps replace the research chronology or that one card is rendered per paper. '
              'Keep onboarding stable and short: title, one-sentence value proposition, language switch, lightweight '
              'status badges, and three area routes to each area’s map, recipes, and complete registry.'
          )
          text = replace_once(text, old, new, 'CURATION onboarding contract')
          recipe_bullet = (
              '- **Evaluation recipes:** maintain a compact decision table for each area that maps common research '
              'claims to one Core benchmark, complementary coverage, and one explicit remaining inference gap. Keep '
              '3–5 recipes per area. Recipes are curated starting points, not rankings, exhaustive experimental '
              'suites, or substitutes for reading protocol/confounder metadata.\n'
          )
          if recipe_bullet not in text:
              target = '- **Recent release timeline:**'
              text = text.replace(target, recipe_bullet + target, 1)
          path.write_text(text, encoding='utf-8')

          # Daily workflow: preserve the new intent-first entry layer during autonomous updates.
          path = ROOT / 'docs' / 'DAILY_WORKFLOW.md'
          text = path.read_text(encoding='utf-8')
          start = text.index('The public reader contract is **signal-first, then table-first**:')
          end = text.index('\n\nPer-item `<details>`', start)
          projection = textwrap.dedent('''
          The public reader contract is **intent-first for navigation, then signal-first and table-first for research**:

          0. **Area router + Evaluation Recipes** — the compact onboarding layer routes readers independently into Agent Memory, RAG / Agentic Retrieval, or Data Agents. Each area exposes links to its Benchmark Map, recipe table, and complete registry. The recipe layer contains 3–5 common research claims per area, each with Core, Complement, and one explicit remaining inference gap. These layers are stable decision support; Daily publication preserves them rather than regenerating them from release order.
          1. **30-day frontier signal table** — the first visible **research-trend synthesis** after the navigation/selection layers. It has exactly three rows: Agent Memory, RAG / Agentic Retrieval, and Data Agents. Each row states one concrete research/evaluation shift supported by representative benchmark links from the current window. It is synthesis, not a list of new papers; say `no material shift` rather than manufacture a trend.
          2. **Recent release timeline table** — show every verified benchmark in the rolling six-month source-release window, reverse chronological by `released`, preserving day/month precision and the whole boundary month. No fixed item cap and no editorial sampling. The reader-facing columns are time, area, benchmark, and one concise `What it tests / 考察内容` field; do not add a parallel `what changed / 相较以往` column.
          3. **Benchmark Map** — for each of the three areas, keep one short evolution sentence plus one visible **Defining chain / 主干** of representative benchmarks. Do not add a separate “three areas” summary layer.
          4. **Complete area tables in README** — every canonical Agent Memory, RAG / Agentic Retrieval, and Data Agent record remains directly scannable in the main page. Each row has stage, benchmark, Semantic Scholar citation count, release time, and one concise `What it tests / 考察内容` description. Citation count is context only and must not drive stage ordering. Do not replace these tables with links to the Library.
          5. **Reading Paths and Library** — guide deeper study and provide the canonical alternate browse surface. The Library may retain richer genealogy and change-oriented explanation.
          ''').strip()
          text = text[:start] + projection + text[end:]
          old_validation = (
              'Validation must additionally guard the signal-first and table-first contract: both README languages '
              'must begin their research content with the three-row 30-day frontier-signal table, put the rolling '
              'release table immediately after it, contain no public per-item deep-read or rolling 7-day/30-day '
              'synthesis surface, keep one defining chain for each Benchmark Map area, keep one `What it tests / '
              '考察内容` column rather than a parallel change column in the main README tables, retain all three '
              'complete area tables in README, and never move those tables exclusively into `library/`.'
          )
          new_validation = (
              'Validation must additionally guard the intent-first, signal-first, and table-first contract: both '
              'README languages must expose the same three area routes, one bounded Evaluation Recipes block with '
              '3–5 recipes per area, and stable per-area registry anchors; the three-row 30-day frontier-signal table '
