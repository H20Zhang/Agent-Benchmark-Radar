                          observed_links[filename] = re.findall(r"\]\((https?://[^)]+)\)", block)
                  self.assertEqual(observed_links["README.md"], observed_links["README.en.md"])


          if __name__ == "__main__":
              unittest.main()
          ''').strip() + '\n'
