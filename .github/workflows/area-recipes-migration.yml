name: One-off area routing and evaluation recipes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/area-recipes-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reader migration
        run: python scripts/_oneoff_area_recipes.py
      - name: Validate repository
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_reading.py
      - name: Commit migration and clean up
        run: |
          git config user.name 'agent-benchmark-radar-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/area-recipes-migration.yml scripts/_oneoff_area_recipes.py
          git add README.md README.en.md CURATION.md docs/DAILY_WORKFLOW.md docs/EDITORIAL_STANDARD.md scripts/validate_reading.py tests/test_evaluation_recipes.py
          git diff --cached --quiet && exit 0
          git commit -m 'add area routes and evaluation recipes'
          git push origin HEAD:main
