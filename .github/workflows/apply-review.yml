name: Apply verified publication review
on:
  push:
    branches: [fix/audit-complete-20260906]
    paths: [.github/workflows/apply-review.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify base and reconstruct reviewed text files
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path, PurePosixPath
          digest = lambda b: hashlib.sha256(b).hexdigest()
          chunks = [Path(f'.review-transfer-{i}.txt').read_text().strip() for i in range(1,4)]
          raw = lzma.decompress(base64.b64decode(''.join(chunks), validate=True))
          assert digest(raw) == '42b077fc3f6aac233b7679f8f32ec86ff2d5928062848707a90ceeee914a5573', 'Payload digest mismatch'
          changes = json.loads(raw)['files']
          staged = []
          for name, change in changes.items():
              p = PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] != '.git', name
              if p.parts[0] == '.github':
                  assert name == '.github/workflows/pages.yml'
                  continue  # Apply the small workflow edit separately through the authorized GitHub connector.
              path = Path(name)
              before = path.read_bytes() if path.exists() else None
              assert (digest(before) if before is not None else None) == change['before'], f'Base changed: {name}'
              if change.get('delete'):
                  path.unlink()
              else:
                  if 'content' in change:
                      after = change['content']
                  else:
                      lines = before.decode('utf8').splitlines(keepends=True)
                      for start, end, replacement in reversed(change['edits']):
                          lines[start:end] = replacement.splitlines(keepends=True)
                      after = ''.join(lines)
                  data = after.encode('utf8')
                  assert digest(data) == change['after'], f'Reconstruction mismatch: {name}'
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
              staged.append(name)
          subprocess.run(['git', 'add', '--all', '--', *staged], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: preserve bilingual evidence, filter intent and result conditions'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:fix/audit-complete-20260906'], check=True)
          print(f'Applied {len(staged)} checksum-verified files.')
          PY
