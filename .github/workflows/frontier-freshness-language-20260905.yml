name: Frontier Freshness Language 2026-09-05
on:
  push:
    branches:
      - chatgpt/frontier-freshness-language-20260905
    paths:
      - scripts/repair_frontier_freshness_language_20260905.py
      - .github/workflows/frontier-freshness-language-20260905.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/frontier-freshness-language-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply repair
        run: python scripts/repair_frontier_freshness_language_20260905.py
      - name: Validate repository and web
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_reading.py
          python scripts/validate_detail_pages.py
          python scripts/audit_detail_pages.py
          cd web
          npm install --no-audit --no-fund
          npm test
          npm run check
          npm run build
      - name: Commit materialized repair
        run: |
          rm .github/workflows/frontier-freshness-language-20260905.yml
          rm scripts/repair_frontier_freshness_language_20260905.py
          git config user.name 'Hao Zhang'
          git config user.email 'zhanghaowuda12@gmail.com'
          git add -A
          git commit -m 'fix: make frontier selection freshness and Chinese prose explicit'
          git push origin HEAD:chatgpt/frontier-freshness-language-20260905
