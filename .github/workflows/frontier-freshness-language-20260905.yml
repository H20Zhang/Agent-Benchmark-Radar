          section='''    <section class="frontier-progress">\n      <div class="shell">\n        <header class="frontier-section-heading"><div><p class="eyebrow">Frontier watchlist</p><h2>{lang === "zh" ? "最近 30 天：全部新收录 Benchmark" : "Last 30 days: every newly released benchmark in scope"}</h2></div><p>{lang === "zh" ? "这里不再做跨指标的伪归一化散点图。选入规则是客观的：在最近一次 discovery scan 前 30 天内发布、属于三条 Radar 主线、且 canonical registry 中状态为 active 的全部 Benchmark，一个不抽样。" : "This replaces the cross-metric scatter plot. The inclusion rule is objective: every active canonical benchmark in the three Radar areas released within 30 days before the latest discovery scan—no sampling."}</p></header>\n        <div class="frontier-freshness-summary">\n          <strong>{lang === "zh" ? `Discovery 最近核验：${freshness.discovery_scan_at}` : `Discovery last verified: ${freshness.discovery_scan_at}`}</strong>\n          <span>{lang === "zh" ? `最近 ${freshness.window_days} 天共 ${recentItems.length} 个` : `${recentItems.length} in the last ${freshness.window_days} days`}</span>\n          <span>{lang === "zh" ? `Registry：${items.length} 个` : `Registry: ${items.length}`}</span>\n          <span>{lang === "zh" ? `结构化成绩轨道：${resultSets.size} 个` : `Structured result tracks: ${resultSets.size}`}</span>\n        </div>\n        <div class="frontier-watchlist" role="table" aria-label={lang === "zh" ? "最近三十天 benchmark watchlist" : "30-day benchmark watchlist"}>\n          <div class="frontier-watchlist__row frontier-watchlist__head" role="row"><b>{lang === "zh" ? "发布日期" : "Released"}</b><b>Benchmark</b><b>{lang === "zh" ? "方向" : "Area"}</b><b>{lang === "zh" ? "条目核验" : "Registry verified"}</b><b>{lang === "zh" ? "成绩轨道" : "Result track"}</b></div>\n          {recentItems.map((item) => { const rs = resultSets.get(item.id); return <a class="frontier-watchlist__row" role="row" href={sitePath(localePath(lang, `benchmarks/${item.id}/`))}><time datetime={item.released}>{item.released}</time><strong>{item.name}</strong><span>{copy.areas[item.area].label}</span><time datetime={item.last_verified}>{item.last_verified}</time><span>{rs ? (lang === "zh" ? `已核验至 ${rs.verified_at}` : `verified ${rs.verified_at}`) : (lang === "zh" ? "尚未建立" : "not tracked yet")}</span></a>; })}\n        </div>\n        <p class="frontier-selection-note">{lang === "zh" ? "为什么这些 Benchmark 在这里？因为它们满足时间窗口与收录范围，而不是因为人工挑选了“看起来强”的点。真正的前沿判断放在下面的 Frontier shifts：那里每条判断都必须说明测量边界发生了什么变化。" : "Why these benchmarks? They satisfy the time window and scope, rather than being hand-picked as visually impressive points. Actual frontier judgments live in Frontier shifts below, where each entry must state what changed in the measurement boundary."}</p>\n      </div>\n    </section>\n\n'''
          s=s[:sec_start]+section+s[sec_end:]
          fp.write_text(s)

          test='''from pathlib import Path\nimport json,re,unittest\nROOT=Path(__file__).resolve().parents[1]\nclass FreshnessLanguageContract(unittest.TestCase):\n  def test_readme_counts_follow_registry(self):\n    n=len(json.loads((ROOT/'data/benchmarks.json').read_text()))\n    self.assertIn(f'组织 {n} 个 Benchmark',(ROOT/'README.md').read_text())\n    self.assertIn(f'{n} benchmarks organized by',(ROOT/'README.en.md').read_text())\n  def test_frontier_has_explicit_selection_not_opaque_scatter(self):\n    t=(ROOT/'web/src/pages/[lang]/frontier/index.astro').read_text()\n    self.assertIn('every active canonical benchmark',t)\n    self.assertIn('Discovery last verified',t)\n    self.assertNotIn('progress-map__point',t)\n    self.assertNotIn('getProgressPoint',t)\n  def test_scale_qa_chinese_avoids_unnecessary_english_prose(self):\n    t=(ROOT/'benchmarks/scale-qa.md').read_text()\n    for phrase in ['memory system','evidence containment','system-level evidence','runtime noise construction','protocol cell']:\n      self.assertNotIn(phrase,t)\n  def test_freshness_scan_is_current_and_separate(self):\n    f=json.loads((ROOT/'data/freshness.json').read_text())\n    self.assertEqual('2026-09-05',f['discovery_scan_at'])\n    self.assertIn('separately',f['note'])\nif __name__=='__main__': unittest.main()\n'''
          (root/'tests/test_freshness_language.py').write_text(test)
          PY
