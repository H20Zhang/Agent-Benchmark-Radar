'eal-bench.md':'''# EAL-Bench：持久记忆是否会“洗出”从未存在的权限

**中文** | [English](eal-bench.en.md) · [返回入口](../README.md) · [Benchmark Library](../library/README.md)

[论文](https://arxiv.org/abs/2609.01836) · **领域：Agent Memory**

## 它到底测什么

EAL-Bench 把“记忆是否准确”进一步收紧为**授权状态是否被忠实保存，以及错误授权是否会传播成真实行动**。它把记忆写入者、下游执行者、规范授权账本和动作判定拆开，区分错误权限的形成与传播。

## 相比前身多测了什么

AuthMem-Bench 已把来源权威带进持久记忆评测；EAL-Bench 更进一步，直接追踪权限、限制和撤销随时间变化时，记忆是否会产生底层历史从未授予的权限，并检查执行者是否会据此采取越权行动。

## 评测协议与证据

论文在采购、网络安全和金融三个领域中，让 5 个模型担任记忆写入者、2 个模型担任执行者。增量记忆更新在部分设置下会为最多 50.2% 的未授权请求形成虚假权限；一旦虚假权限进入记忆，执行者在 98.6% 的试验中会据此行动。

## 结论边界

这说明持久记忆本身可能成为智能体的有效授权策略组成部分，而不只是性能组件。但结果仍依赖授权任务构造、写入格式、写入模型与执行模型，不能直接推广到所有企业权限系统。

## 剩余缺口

还需要更长时间跨度、更多工具与多写入者场景，以及真实权限系统中的独立复现；防御还要同时报告安全收益与合法请求被误拒的代价。

## 研究决策卡

最有判别力的下一实验是固定执行模型和授权历史，只改变记忆表示与更新机制，同时分别报告“虚假权限形成率”和“形成后越权执行率”。这样才能判断问题来自记忆写入，还是来自下游执行者对记忆的过度信任。

Primary: https://arxiv.org/abs/2609.01836
''',
'eal-bench.en.md':'''# EAL-Bench: when persistent memory creates authority that history never granted

[中文](eal-bench.md) | **English** · [Home](../README.en.md) · [Benchmark Library](../library/README.en.md)

[Paper](https://arxiv.org/abs/2609.01836) · **Area: Agent Memory**

## What it measures

EAL-Bench narrows memory correctness to preservation of evolving authorization state and asks whether memory errors propagate into executable unauthorized actions. It separates the memory writer, downstream executor, canonical authorization ledger, and action predicate.

## Compared with what

AuthMem-Bench already makes source authority explicit. EAL-Bench adds evolving permissions, restrictions, and revocations, then tests both formation of false authority in memory and downstream propagation into actions.

## Protocol and decisive evidence

Across procurement, cybersecurity, and finance, five LLMs act as memory writers and two as executors. Under incremental memory updates, false authority is created for up to 50.2% of unauthorized requests in some settings; once present, executors act on it in 98.6% of trials.

## Score boundary

The result supports treating persistent memory as part of an agent's effective authorization policy, not merely as a performance component. It does not establish behavior across arbitrary enterprise authorization systems because writer, executor, update representation, and task construction remain load-bearing variables.

## Remaining gap

Longer deployments, multi-writer memory, broader tool stacks, and independent evaluation on real authorization systems remain open. Mitigations should report both security benefit and the utility cost from rejecting legitimate actions.

## Research decision

The most discriminating next experiment holds the executor and authorization history fixed while changing only the memory representation/update mechanism, reporting false-authority formation separately from execution after formation.

Primary: https://arxiv.org/abs/2609.01836
''',
'memory-trust-gap.md':'''# The Memory Trust Gap：更强的模型也可能更相信过期记忆

**中文** | [English](memory-trust-gap.en.md) · [返回入口](../README.md) · [Benchmark Library](../library/README.md)

[论文](https://arxiv.org/abs/2609.01852) · **领域：Agent Memory**

## 它到底测什么

该基准测量持久记忆与当前权威证据冲突时，模型何时会**错误相信过期记忆**。Benefit 套件中，任务没有记忆就无法完成；Safety 套件中，权威工具始终给出当前正确值，因此两套任务把“记忆有帮助”和“记忆会伤害”明确分开。

## 相比前身多测了什么

StateMemBench、MemTrapBench 等已暴露过期状态和记忆诱导错误；这里新增的关键坐标是**模型能力规模与记忆过度信任之间的交互**，并用受控因子实验分别改变标签、时间新近性、来源权威和位置。

## 决定性证据

论文在 Qwen3 0.6B、1.7B、4B、8B 的同系列模型上发现：Benefit 套件里各规模模型都高度依赖记忆；Safety 套件里，更大模型在某些“过期记忆看起来更新”的条件下反而出现更明显的伤害。作者还在 Llama-Instruct 系列和两个外部数据集上验证了主要模式。

## 结论边界

结果支持“持久记忆的信任策略具有模型能力依赖性”，但不能直接推出更强模型普遍更不安全；任务是冻结、封闭集合且受控的，具体失败还依赖记忆呈现方式与冲突构造。

## 剩余缺口

需要在开放世界、多工具、多来源以及长期写入历史中验证，并区分模型对记忆、普通文档和工具证据的信任策略是否一致。

## 研究决策卡

最有价值的用法是把“有记忆/无记忆”扩展成至少三臂：无记忆、过期记忆、过期记忆+当前权威工具证据，并按模型规模做同系列比较。这样可以区分记忆收益、记忆伤害与冲突解决能力。

Primary: https://arxiv.org/abs/2609.01852
''',
'memory-trust-gap.en.md':'''# The Memory Trust Gap: stronger models can still over-trust stale memory

[中文](memory-trust-gap.md) | **English** · [Home](../README.en.md) · [Benchmark Library](../library/README.en.md)

[Paper](https://arxiv.org/abs/2609.01852) · **Area: Agent Memory**

## What it measures

The benchmark measures when a persistent-memory agent trusts a stale stored fact over current authoritative evidence. A Benefit suite requires memory to solve the task; a Safety suite always exposes the correct current value through an authoritative tool, separating useful memory from harmful over-trust.

## Compared with what

StateMemBench and MemTrapBench already expose stale-state and memory-induced failures. This work adds model-capability scale as an explicit coordinate and uses controlled interventions over labeling, recency, source authority, and position.

## Decisive evidence

Across Qwen3 0.6B, 1.7B, 4B, and 8B, memory is heavily used in the Benefit suite. In the Safety suite, larger models can be harmed more strongly under conditions where stale memory is made to look newer. The main pattern is also tested on a Llama-Instruct size series and two external datasets.

## Score boundary

The evidence supports capability-dependent memory-trust behavior; it does not establish that stronger models are generally less safe. The tasks are frozen, closed-set, and controlled, and the observed interaction depends on presentation and conflict construction.

## Remaining gap

Open-world agents with multiple tools, multiple sources, and long write histories remain unmeasured, as does whether models apply the same trust policy to memory, ordinary documents, and tool evidence.

## Research decision

A useful minimum design is three-arm rather than memory/no-memory: no memory, stale memory, and stale memory plus current authoritative tool evidence, run across a same-family model-size series.

Primary: https://arxiv.org/abs/2609.01852
'''
