name: One-off citation monotonicity fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: github.event.issue.title == 'trigger-citation-monotonicity-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make confirmed citation identities non-regressive
        shell: python
        run: |
          import json
          from pathlib import Path

          registry_path = Path('data/benchmarks.json')
          records = json.loads(registry_path.read_text(encoding='utf-8'))
          locomo_plus = next((r for r in records if r.get('id') == 'locomo-plus'), None)
          if locomo_plus is None:
              raise SystemExit('locomo-plus missing from registry')
          locomo_plus.setdefault('artifacts', {})['preprint'] = 'https://arxiv.org/abs/2602.10715'
          registry_path.write_text(json.dumps(records, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          script_path = Path('scripts/update_citations.py')
          text = script_path.read_text(encoding='utf-8')

          marker = 'def _refresh_citations(records: list[dict[str, object]], today: str) -> bool:\n'
          helper = '''def _valid_cached_citation(value: object) -> bool:\n    return (\n        isinstance(value, dict)\n        and value.get("status") == "ok"\n        and isinstance(value.get("count"), int)\n        and value.get("count") >= 0\n        and isinstance(value.get("paper_id"), str)\n        and bool(value.get("paper_id"))\n        and isinstance(value.get("url"), str)\n        and bool(value.get("url"))\n    )\n\n\ndef _refresh_citations(records: list[dict[str, object]], today: str) -> bool:\n'''
          if 'def _valid_cached_citation' not in text:
              if marker not in text:
                  raise SystemExit('refresh marker changed unexpectedly')
              text = text.replace(marker, helper, 1)

          old = '''        if external_id is None:\n            artifacts = record.get("artifacts")\n            has_paper = isinstance(artifacts, dict) and bool(artifacts.get("paper"))\n            desired = {\n'''
          new = '''        if external_id is None:\n            artifacts = record.get("artifacts")\n            has_paper = isinstance(artifacts, dict) and bool(artifacts.get("paper"))\n            if has_paper and _valid_cached_citation(record.get("citations")):\n                continue\n            desired = {\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('external-id miss branch changed unexpectedly')

          old = '''        if not isinstance(paper, dict):\n            desired = {\n'''
          new = '''        if not isinstance(paper, dict):\n            if _valid_cached_citation(record.get("citations")):\n                continue\n            desired = {\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('paper miss branch changed unexpectedly')

          old = '''            if not isinstance(count, int) or count < 0 or not isinstance(paper_id, str):\n                desired = {\n'''
          new = '''            if not isinstance(count, int) or count < 0 or not isinstance(paper_id, str):\n                if _valid_cached_citation(record.get("citations")):\n                    continue\n                desired = {\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('invalid-paper branch changed unexpectedly')

          script_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_citation_resilience.py')
          test_path.write_text('''import importlib.util\nfrom pathlib import Path\nimport unittest\nfrom unittest.mock import patch\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef _load_updater():\n    path = ROOT / "scripts" / "update_citations.py"\n    spec = importlib.util.spec_from_file_location("citation_updater", path)\n    module = importlib.util.module_from_spec(spec)\n    assert spec.loader is not None\n    spec.loader.exec_module(module)\n    return module\n\n\nclass CitationRefreshResilienceTest(unittest.TestCase):\n    def test_confirmed_citation_survives_transient_lookup_miss(self):\n        updater = _load_updater()\n        record = {\n            "id": "example",\n            "artifacts": {"paper": "https://aclanthology.org/2026.acl-long.1/"},\n            "citations": {\n                "count": 6,\n                "source": "semantic-scholar",\n                "updated_at": "2026-08-24",\n                "status": "ok",\n                "paper_id": "confirmed-paper-id",\n                "url": "https://www.semanticscholar.org/paper/confirmed-paper-id",\n            },\n        }\n        before = dict(record["citations"])\n        with patch.object(updater, "_request_json", return_value=[None]), patch.object(\n            updater, "_s2_title_fallback", return_value=None\n        ):\n            changed = updater._refresh_citations([record], "2026-08-25")\n        self.assertFalse(changed)\n        self.assertEqual(before, record["citations"])\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

      - name: Refresh citation counts
        run: python scripts/update_citations.py
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}

      - name: Require LoCoMo-Plus and final aliases to stay resolved
        shell: python
        run: |
          import json
          from pathlib import Path
          required = {'locomo-plus', 'mem2actbench', 'mudabench', 'da-code'}
          records = json.loads(Path('data/benchmarks.json').read_text(encoding='utf-8'))
          states = {r.get('id'): r.get('citations', {}) for r in records if r.get('id') in required}
          bad = [identity for identity in required if states.get(identity, {}).get('status') != 'ok']
          if bad:
              raise SystemExit(f'formal paper citations unresolved after refresh: {sorted(bad)}')
          for identity in sorted(required):
              print(identity, states[identity].get('count'), states[identity].get('paper_id'))

      - name: Validate repository
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_reading.py
          git diff --check

      - name: Commit fix and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/oneoff-citation-monotonicity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "make citation refresh non-regressive"
          git push origin HEAD:main

      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Citation refresh is now non-regressive, LoCoMo-Plus has a deterministic arXiv identity, and the repository passed validation."
