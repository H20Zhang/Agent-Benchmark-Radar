name: One-off deterministic citation aliases

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: github.event.issue.title == 'trigger-citation-arxiv-aliases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add canonical preprint aliases and resolver support
        shell: python
        run: |
          import json
          from pathlib import Path

          aliases = {
              'mem2actbench': 'https://arxiv.org/abs/2601.19935',
              'mudabench': 'https://arxiv.org/abs/2604.22239',
              'da-code': 'https://arxiv.org/abs/2410.07331',
          }

          registry_path = Path('data/benchmarks.json')
          records = json.loads(registry_path.read_text(encoding='utf-8'))
          found = set()
          for record in records:
              identity = record.get('id')
              if identity not in aliases:
                  continue
              artifacts = record.setdefault('artifacts', {})
              artifacts['preprint'] = aliases[identity]
              found.add(identity)
          missing = set(aliases) - found
          if missing:
              raise SystemExit(f'missing benchmark identities: {sorted(missing)}')
          registry_path.write_text(
              json.dumps(records, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          script_path = Path('scripts/update_citations.py')
          text = script_path.read_text(encoding='utf-8')
          old = '''    paper = artifacts.get("paper")
              if not isinstance(paper, str) or not paper.strip():
                  return None
          '''
          new = '''    paper = artifacts.get("preprint") or artifacts.get("paper")
              if not isinstance(paper, str) or not paper.strip():
                  return None
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('citation artifact resolver changed unexpectedly')
          script_path.write_text(text, encoding='utf-8')

          schema_path = Path('SCHEMA.md')
          schema = schema_path.read_text(encoding='utf-8')
          old_schema = '- `artifacts`: verified first-party paper/code/data/leaderboard links only'
          new_schema = '- `artifacts`: verified first-party paper/code/data/leaderboard links only; `paper` keeps the preferred publication link while optional `preprint` may record the canonical arXiv version for identity resolution'
          if old_schema in schema:
              schema = schema.replace(old_schema, new_schema, 1)
          elif new_schema not in schema:
              raise SystemExit('SCHEMA artifacts line changed unexpectedly')
          schema_path.write_text(schema, encoding='utf-8')

      - name: Refresh citation counts
        run: python scripts/update_citations.py
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}

      - name: Require all paper-linked aliases to resolve
        shell: python
        run: |
          import json
          from pathlib import Path
          required = {'mem2actbench', 'mudabench', 'da-code'}
          records = json.loads(Path('data/benchmarks.json').read_text(encoding='utf-8'))
          unresolved = []
          for record in records:
              if record.get('id') not in required:
                  continue
              citation = record.get('citations') or {}
              if citation.get('status') != 'ok' or not isinstance(citation.get('count'), int):
                  unresolved.append(record.get('id'))
          if unresolved:
              raise SystemExit(f'deterministic aliases still unresolved: {unresolved}')

      - name: Validate repository
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_reading.py
          git diff --check

      - name: Commit fix and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/oneoff-citation-arxiv-aliases.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "resolve remaining paper citation aliases"
          git push origin HEAD:main

      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Deterministic arXiv citation aliases resolved, refreshed, validated, and the one-off workflow removed."
