name: Apply and Validate Full Editorial Pass

on:
  push:
    branches: [chatgpt/full-editorial-20260905]
    paths: [.github/workflows/full-editorial-pass-v2.yml]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: full-editorial-pass
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply authored changes only when not already integrated
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/editorial/reading_guides.json ]; then
            python scripts/run_full_editorial_pass.py | tee /tmp/editorial-migration.log
          fi
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          for filename in ('README.md', 'README.en.md'):
              original = subprocess.check_output(['git', 'show', 'fba883e0131113924d9ae2393ccfd62c5e20c05a:' + filename], text=True)
              region = original.split('<!-- ONBOARDING:END -->', 1)[0]
              candidates = [line for line in region.splitlines() if '<p><strong>' in line and ('网站待完善' in line or ('website' in line.lower() and ('improvement' in line.lower() or 'readme' in line.lower())))]
              if len(candidates) == 1:
                  path = Path(filename); text = path.read_text()
                  pattern = r'<p><strong>网站待完善[^\n]*</strong></p>' if filename == 'README.md' else r'<p><strong>The website is under improvement[^\n]*</strong></p>'
                  path.write_text(re.sub(pattern, lambda _: candidates[0], text))
          path = Path('.github/workflows/validate.yml')
          path.write_text(path.read_text().replace('Audit benchmark detail depth', 'Audit authored-note integrity'))
          PY
      - name: Validate complete Python and content contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/editorial-python-tests.log
          python scripts/validate_reading.py 2>&1 | tee /tmp/editorial-readme-validation.log
          python scripts/validate_detail_pages.py 2>&1 | tee /tmp/editorial-note-validation.log
          python scripts/audit_detail_pages.py 2>&1 | tee /tmp/editorial-integrity.log
      - name: Validate and build the website
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test 2>&1 | tee /tmp/editorial-web-tests.log
          npm run check 2>&1 | tee /tmp/editorial-astro-check.log
          npm run build 2>&1 | tee /tmp/editorial-build.log
      - name: Inspect every built benchmark page
        run: |
          python - <<'PY' | tee /tmp/editorial-render-validation.log
          import json
          from pathlib import Path
          from html.parser import HTMLParser
          class Inspector(HTMLParser):
              def __init__(self): super().__init__(); self.h1 = 0; self.bad = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'h1': self.h1 += 1
                  for key, value in attrs:
                      if key in ('href', 'src') and value and value.lower().startswith(('javascript:', 'data:text/html')): self.bad.append(value)
          registry = json.loads(Path('data/benchmarks.json').read_text()); checked = 0
          for item in registry:
              for lang in ('zh', 'en'):
                  path = Path('web/dist') / lang / 'benchmarks' / item['id'] / 'index.html'
                  html = path.read_text(); parser = Inspector(); parser.feed(html)
                  assert parser.h1 == 1 and not parser.bad, path
                  assert 'Canonical evaluation contract' not in html and '规范评测契约' not in html, path
                  assert ('建议的判别实验' if lang == 'zh' else 'Suggested discriminating experiment') in html, path
                  checked += 1
          print(f'Validated {checked} rendered benchmark pages; this is structural validation, not factual certification.')
          PY
      - name: Publish only the validated revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/full-editorial-pass.yml .github/workflows/full-editorial-pass-v2.yml .github/workflows/editorial-snapshot.yml scripts/apply_full_editorial_pass.py scripts/run_full_editorial_pass.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'content: integrate all 126 bilingual guides and rebuild README orientation'
          fi
          # Concurrent updates are never overwritten. A moved remote branch stops
          # publication and requires validation of the combined source.
          REMOTE_SHA=$(git ls-remote origin refs/heads/chatgpt/full-editorial-20260905 | cut -f1)
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "Branch moved during validation: $REMOTE_SHA; refusing to publish an unvalidated combination."
            exit 1
          fi
          git push origin HEAD:chatgpt/full-editorial-20260905
          HEAD_SHA=$(git rev-parse HEAD)
          printf '%s\n' "$HEAD_SHA" > /tmp/editorial-head-sha.txt
          cat > /tmp/editorial-pr-body.md <<'EOF'
          ## Changes
          All 126 benchmark pairs receive authored selection judgments, clearly labeled illustrative tasks and discriminating experiment proposals, integrated into the actual 252 Markdown notes. Existing evidence and limitations are retained. All website editorial overlays are synchronized.

          Both README entry points are reorganized for discovery and selection while retaining canonical catalogs, stable links and time-oriented content. Runtime canonical padding and global wording substitutions are removed. The renderer supports safe local benchmark links, tables and code blocks. Keyword-based quality grades are replaced by a structural authorship, synchronization and link audit.

          ## Evidence boundary
          Editing is not re-verification of every paper or leaderboard. Source-verification dates are preserved. Illustrations and experiment proposals are not represented as reported tasks or results. No new leaderboard numbers were invented.

          ## Validation
          The publishing job is gated by the complete Python contracts, content validators, structural editorial audit, web tests, Astro check, static build and inspection of all rendered benchmark pages. Failed checks stop publication and merging.
          EOF
          PR_URL=$(gh pr list --repo "$GITHUB_REPOSITORY" --head chatgpt/full-editorial-20260905 --base main --state open --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --head chatgpt/full-editorial-20260905 --base main --title 'content: overhaul all benchmark guides and README orientation' --body-file /tmp/editorial-pr-body.md)
          else
            gh pr edit "$PR_URL" --body-file /tmp/editorial-pr-body.md
          fi
          printf '%s\n' "$PR_URL" > /tmp/editorial-pr-url.txt
          printf 'Validated commit: `%s`\n\nPR: %s\n' "$HEAD_SHA" "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA" --subject 'content: overhaul all benchmark guides and README orientation'
      - name: Collect validation evidence
        if: always()
        run: |
          mkdir -p /tmp/editorial-evidence
          cp /tmp/editorial-*.log /tmp/editorial-*.txt /tmp/editorial-pr-body.md /tmp/editorial-evidence/ 2>/dev/null || true
          git diff --stat > /tmp/editorial-evidence/working-diff-stat.txt
          git diff > /tmp/editorial-evidence/working.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-editorial-validation
          path: /tmp/editorial-evidence
          retention-days: 7
