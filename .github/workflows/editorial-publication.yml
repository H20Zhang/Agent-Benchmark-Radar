name: Verify Editorial Publication

on:
  workflow_run:
    workflows: [Apply and Validate Full Editorial Pass]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: editorial-pages-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'chatgpt/full-editorial-20260905' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Confirm the authored migration is actually on main
        run: |
          test -f data/editorial/reading_guides.json
          python scripts/validate_reading.py
          python scripts/validate_detail_pages.py
          python scripts/audit_detail_pages.py
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate and build the merged source
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run check
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified main revision
        id: deployment
        uses: actions/deploy-pages@v4
