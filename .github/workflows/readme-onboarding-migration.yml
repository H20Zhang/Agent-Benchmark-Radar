name: One-off README onboarding polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/readme-onboarding-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply onboarding redesign
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          zh_hero = r'''<!-- ONBOARDING:START -->
          <div align="center">

          <h1>Agent Benchmark Radar</h1>

          <p><strong>追踪 Agent 评测正在变成什么，而不只是收集有哪些 Benchmark。</strong></p>

          <p>
          覆盖 <b>Agent Memory</b> · <b>RAG / Agentic Retrieval</b> · <b>Data Agents</b><br/>
          把最新 Benchmark 放回演化脉络：它多测了什么、相比什么、还漏了什么。
          </p>

          <p><strong>中文</strong> · <a href="README.en.md">English</a></p>

          <p>
          <a href="https://github.com/H20Zhang/Agent-Benchmark-Radar/actions/workflows/validate.yml"><img alt="Validation" src="https://github.com/H20Zhang/Agent-Benchmark-Radar/actions/workflows/validate.yml/badge.svg"></a>
          <a href="https://github.com/H20Zhang/Agent-Benchmark-Radar/stargazers"><img alt="GitHub stars" src="https://img.shields.io/github/stars/H20Zhang/Agent-Benchmark-Radar?style=flat"></a>
          <img alt="Last commit" src="https://img.shields.io/github/last-commit/H20Zhang/Agent-Benchmark-Radar?style=flat">
          </p>

          </div>

          ## 从这里开始

          | 你现在想知道 | 直接看 |
          |---|---|
          | **最近评测范式发生了什么变化？** | [近 30 天：三个变化](#frontier-signals) |
          | **最近有哪些新 Benchmark？** | [最近半年 Benchmark 时间线](#release-timeline) |
          | **一个方向为什么演化成今天这样？** | [Benchmark 地图](#field-map) |
          | **给自己的研究找 Benchmark？** | [全部 Benchmark](#all-benchmarks) · [Library](library/README.md) |

          _收录标准：只纳入可复用的 benchmark / evaluation contribution；仅在已有 benchmark 上报告实验结果的论文不进入 registry。详见 [Curation](CURATION.md)。_

          ---
          <!-- ONBOARDING:END -->'''

          en_hero = r'''<!-- ONBOARDING:START -->
          <div align="center">

          <h1>Agent Benchmark Radar</h1>

          <p><strong>Track how agent evaluation is evolving—not just which benchmarks exist.</strong></p>

          <p>
          Covers <b>Agent Memory</b> · <b>RAG / Agentic Retrieval</b> · <b>Data Agents</b><br/>
          Maps new benchmarks back to their lineage: what became measurable, compared with what, and what is still missing.
          </p>

          <p><a href="README.md">中文</a> · <strong>English</strong></p>

          <p>
          <a href="https://github.com/H20Zhang/Agent-Benchmark-Radar/actions/workflows/validate.yml"><img alt="Validation" src="https://github.com/H20Zhang/Agent-Benchmark-Radar/actions/workflows/validate.yml/badge.svg"></a>
          <a href="https://github.com/H20Zhang/Agent-Benchmark-Radar/stargazers"><img alt="GitHub stars" src="https://img.shields.io/github/stars/H20Zhang/Agent-Benchmark-Radar?style=flat"></a>
          <img alt="Last commit" src="https://img.shields.io/github/last-commit/H20Zhang/Agent-Benchmark-Radar?style=flat">
          </p>

          </div>

          ## Start Here

          | What do you want to know? | Go straight to |
          |---|---|
          | **What changed in agent evaluation recently?** | [Three shifts in the last 30 days](#frontier-signals) |
          | **Which new benchmarks were released?** | [Six-month benchmark timeline](#release-timeline) |
          | **How did an area evolve into its current form?** | [Benchmark Map](#field-map) |
          | **Which benchmark should I use for my research?** | [All benchmarks](#all-benchmarks) · [Library](library/README.en.md) |

          _Scope: the registry includes reusable benchmark / evaluation contributions. Papers that only report results on existing benchmarks are out of scope. See [Curation](CURATION.md)._

          ---
          <!-- ONBOARDING:END -->'''

          def replace_prefix(path: str, hero: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              anchor = '<a id="frontier-signals"></a>'
              if anchor not in text:
                  raise SystemExit(f'{path}: missing frontier-signals anchor')
              body = text[text.index(anchor):]
              p.write_text(hero + '\n\n' + body, encoding='utf-8')

          replace_prefix('README.md', zh_hero)
          replace_prefix('README.en.md', en_hero)

          p = Path('CURATION.md')
          text = p.read_text(encoding='utf-8')
          old = 'README is the **table-first public reading surface**. “Time-first” means that the newest research is easiest to scan; it does **not** mean that Radar-maintenance timestamps replace the research chronology or that one card is rendered per paper.'
          new = 'README starts with a compact **onboarding layer** for project identity and reader routing, followed by the **signal-first, table-first research surface**. The onboarding layer is navigation rather than research synthesis. “Time-first” means that the newest research is easiest to scan; it does **not** mean that Radar-maintenance timestamps replace the research chronology or that one card is rendered per paper. Keep onboarding stable and short: title, one-sentence value proposition, language switch, lightweight status badges, and a Start Here router to canonical anchors.'
          if old not in text:
              raise SystemExit('CURATION.md: expected README contract sentence not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('docs/DAILY_WORKFLOW.md')
          text = p.read_text(encoding='utf-8')
          old = '0. **30-day frontier signal table** — the first visible research content after the language switch. Exactly three rows: Agent Memory, RAG / Agentic Retrieval, and Data Agents. Each row states one concrete research/evaluation shift supported by representative benchmark links from the current window. It is synthesis, not a list of new papers; say `no material shift` rather than manufacture a trend.'
          new = '0. **30-day frontier signal table** — the first visible **research** content after the compact onboarding layer. The onboarding layer may contain only project identity, language switch, lightweight status badges, and Start Here navigation; Daily publication preserves it rather than regenerating it. The signal table has exactly three rows: Agent Memory, RAG / Agentic Retrieval, and Data Agents. Each row states one concrete research/evaluation shift supported by representative benchmark links from the current window. It is synthesis, not a list of new papers; say `no material shift` rather than manufacture a trend.'
          if old not in text:
              raise SystemExit('DAILY_WORKFLOW.md: reader projection sentence not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('docs/EDITORIAL_STANDARD.md')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '- Treat README as a data-rich awesome list: put complete tables and direct links ahead of framing prose.': '- Treat README as a data-rich awesome list: use one compact onboarding header, then put frontier signals, complete tables, and direct links ahead of long-form framing prose.',
              '- Layer-level attention navigation is `frontier signal → release timeline → Benchmark Map → complete area tables → Reading Paths → Library`; each layer answers a different reader question without repeating the previous one.': '- Layer-level attention navigation is `onboarding → frontier signal → release timeline → Benchmark Map → complete area tables → Reading Paths → Library`; onboarding only routes the reader, while each research layer answers a different question without repeating the previous one.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'EDITORIAL_STANDARD.md: expected line not found: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate repository
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_reading.py

      - name: Commit polished README and remove migration
        run: |
          rm .github/workflows/readme-onboarding-migration.yml
          git config user.name 'agent-benchmark-radar-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.en.md CURATION.md docs/DAILY_WORKFLOW.md docs/EDITORIAL_STANDARD.md .github/workflows/readme-onboarding-migration.yml
          git diff --cached --quiet && exit 0
          git commit -m 'polish README onboarding and navigation'
          git push origin HEAD:main
