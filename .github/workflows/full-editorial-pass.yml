name: Apply and Validate Full Editorial Pass

on:
  push:
    branches: [chatgpt/full-editorial-20260905]
    paths:
      - .github/workflows/full-editorial-pass.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: full-editorial-pass
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply the authored migration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_full_editorial_pass.py | tee /tmp/editorial-migration.log
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          # Preserve the existing WIP publication boundary verbatim, rather than
          # silently declaring the rest of the website ready for publication.
          for filename in ('README.md', 'README.en.md'):
              old = subprocess.check_output(['git', 'show', f'HEAD:{filename}'], text=True)
              region = old.split('<!-- ONBOARDING:END -->', 1)[0]
              candidates = [line for line in region.splitlines() if '<p><strong>' in line and ('网站待完善' in line or ('website' in line.lower() and ('improvement' in line.lower() or 'readme' in line.lower())))]
              if len(candidates) == 1:
                  path = Path(filename)
                  text = path.read_text()
                  expression = r'<p><strong>网站待完善[^\n]*</strong></p>' if filename == 'README.md' else r'<p><strong>The website is under improvement[^\n]*</strong></p>'
                  text = re.sub(expression, lambda _: candidates[0], text)
                  path.write_text(text)
          path = Path('.github/workflows/validate.yml')
          path.write_text(path.read_text().replace('Audit benchmark detail depth', 'Audit authored-note integrity'))
          PY
      - name: Validate all Python and content contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/editorial-python-tests.log
          python scripts/validate_reading.py 2>&1 | tee /tmp/editorial-readme-validation.log
          python scripts/validate_detail_pages.py 2>&1 | tee /tmp/editorial-note-validation.log
          python scripts/audit_detail_pages.py 2>&1 | tee /tmp/editorial-integrity.log
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Test, check and build the complete website
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/editorial-web-tests.log
          npm run check 2>&1 | tee /tmp/editorial-astro-check.log
          npm run build 2>&1 | tee /tmp/editorial-build.log
      - name: Inspect every rendered benchmark page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/editorial-render-validation.log
          import json
          from pathlib import Path
          from html.parser import HTMLParser
          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__(); self.h1 = 0; self.bad = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'h1': self.h1 += 1
                  for key, value in attrs:
                      if key in ('href', 'src') and value and value.lower().startswith(('javascript:', 'data:text/html')): self.bad.append(value)
          registry = json.loads(Path('data/benchmarks.json').read_text())
          checked = 0
          for item in registry:
              for lang in ('zh', 'en'):
                  path = Path('web/dist') / lang / 'benchmarks' / item['id'] / 'index.html'
                  html = path.read_text()
                  parsed = Inspector(); parsed.feed(html)
                  assert parsed.h1 == 1, (path, parsed.h1)
                  assert not parsed.bad, (path, parsed.bad)
                  assert 'Canonical evaluation contract' not in html and '规范评测契约' not in html, path
                  assert ('建议的判别实验' if lang == 'zh' else 'Suggested discriminating experiment') in html, path
                  checked += 1
          assert checked == 2 * len(registry)
          print(f'Validated {checked} rendered benchmark pages across both locales.')
          print('Rendering checks establish structural output integrity, not factual or semantic certification.')
          PY
      - name: Remove one-shot machinery and publish the validated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/full-editorial-pass.yml scripts/apply_full_editorial_pass.py scripts/run_full_editorial_pass.py
          git diff --stat | tee /tmp/editorial-diff-stat.log
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks data/editorial README.md README.en.md docs/BENCHMARK_DETAIL_PAGE_GUIDE.md scripts web/src/lib/deep-reads.mjs web/src/components/BenchmarkDetail.astro web/tests/deep-reads.test.mjs .github/workflows .editorial
          if ! git diff --cached --quiet; then
            git commit -m 'content: publish all 126 authored bilingual benchmark guides and rebuild README orientation'
            git push origin HEAD:chatgpt/full-editorial-20260905
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          printf '%s\n' "$HEAD_SHA" > /tmp/editorial-head-sha.txt
          cat > /tmp/editorial-pr-body.md <<'EOF'
          ## Scope
          - Integrate authored selection judgments, explicitly illustrative tasks and discriminating experiment proposals into all 126 benchmark pairs (252 Markdown notes).
          - Preserve existing source-backed benchmark evidence and limitations; synchronize all 126 website editorial overlays.
          - Rework both README entry points around discovery, selection and bounded comparison while preserving canonical catalogs, stable anchors and time-oriented content.
          - Remove runtime canonical-appendix padding and global prose substitutions; support safe relative benchmark links, tables, code blocks and hidden editorial markers.
          - Replace keyword-based A–D quality grades with an explicitly structural synchronization and reference audit.

          ## Evidence boundary
          Editing dates are separate from source-verification dates. This pass is not a claim that all 126 papers and live leaderboards were freshly reverified. Illustrations and proposed experiments are labeled, and no new leaderboard numbers were invented.

          ## Validation
          The migration workflow requires the full Python contract suite, README and note validation, authored-guide integrity audit, web tests, Astro check, complete build and inspection of every rendered benchmark page to pass before publishing this generated commit.
          EOF
          PR_URL=$(gh pr list --repo "$GITHUB_REPOSITORY" --head chatgpt/full-editorial-20260905 --base main --state open --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --head chatgpt/full-editorial-20260905 --base main --title 'content: overhaul all benchmark guides and README orientation' --body-file /tmp/editorial-pr-body.md)
          else
            gh pr edit "$PR_URL" --body-file /tmp/editorial-pr-body.md
          fi
          printf '%s\n' "$PR_URL" > /tmp/editorial-pr-url.txt
          printf 'Validated commit: `%s`\n\nPR: %s\n' "$HEAD_SHA" "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          # GitHub's merge endpoint enforces repository rules. No force push,
          # administrative bypass, or weakening of required checks is used.
          gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA" --subject 'content: overhaul all benchmark guides and README orientation'
      - name: Save validation evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/editorial-evidence
          cp /tmp/editorial-*.log /tmp/editorial-*.txt /tmp/editorial-pr-body.md /tmp/editorial-evidence/ 2>/dev/null || true
          git diff --stat > /tmp/editorial-evidence/working-diff-stat.txt
          git status --short > /tmp/editorial-evidence/working-status.txt
          git diff > /tmp/editorial-evidence/working.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-editorial-validation
          path: /tmp/editorial-evidence
          retention-days: 7
