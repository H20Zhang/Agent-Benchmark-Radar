name: One-off README v3 migration

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.issue.title == 'trigger-readme-v3-migration-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python scripts/_oneoff_readme_v3_migration.py
      - name: Commit migration
        run: |
          git config user.name 'agent-benchmark-radar-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'simplify benchmark README scan surface'
          git push origin HEAD:main
