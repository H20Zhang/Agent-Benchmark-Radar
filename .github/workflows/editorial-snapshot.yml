# Include the complete 126-benchmark authored editorial set.
name: Editorial Source Snapshot
on:
  push:
    branches: [chatgpt/full-editorial-20260905]
    paths: [.github/workflows/editorial-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=tar HEAD -o /tmp/radar-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-source
          path: /tmp/radar-source.tar
          retention-days: 1
