name: Validate Benchmark Radar
on:
  push:
    branches: [main, research-radar-reading-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test canonical data and README reading contracts
        run: python -m unittest discover -s tests -v
      - name: Check deterministic bilingual publication
        run: node scripts/render-readme.mjs --check
      - name: Validate README, Library and source identity
        run: python scripts/validate_reading.py
      - name: Validate bilingual benchmark notes
        run: python scripts/validate_detail_pages.py
      - name: Audit note structure without declaring factual certification
        run: python scripts/audit_detail_pages.py
