name: Export README review source
on:
  push:
    branches: [readme-primary-20260906]
    paths: [.github/workflows/readme-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > /tmp/readme-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: readme-source
          path: /tmp/readme-source.tar.gz
          retention-days: 1
