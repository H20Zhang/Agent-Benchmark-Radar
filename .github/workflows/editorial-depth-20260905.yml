name: Editorial Depth 2026-09-05
on:
  push:
    branches: [chatgpt/editorial-depth-20260905]
    paths: [.github/workflows/editorial-depth-20260905.yml]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/editorial-depth-20260905
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Make existing benchmark-specific analysis explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          ROOT=Path('benchmarks')
          measurement=['vakra','locomo-plus','dataspace','dsagentbench']
          validity_zh=['agenticragtracer','wikisql','fdabench','realmem','memprobe','dsaeval','causalds','agent-memory-bench-coding','snapshot-compatibility-audit']
          delta_gap_en=['memfusebench','sp-mem','past-bench','wandr','maple','visdocagentbench','das-bench','recall-trap','commercial-tax']
          gap_en=['data-eng-bench','browsecomp-plus-cm','deltaml-bench','ai4ai-bench']
          validity_en=['browsecomp-plus']
          changed=[]
          def edit(path,repls):
            text=path.read_text(); old=text
            for a,b in repls:
              if a in text: text=text.replace(a,b,1)
            if text!=old: path.write_text(text); changed.append(str(path))
          for i in measurement:
            edit(ROOT/f'{i}.md',[
              ('## 实际怎样评测','## 测量对象与实际怎样评测'),
              ('## 如何评测','## 测量对象与如何评测'),
            ])
          for i in validity_zh:
            edit(ROOT/f'{i}.md',[
              ('## 这个分数能证明什么','## 结论边界：这个分数能证明什么'),
              ('## 分数能说明什么','## 结论边界：分数能说明什么'),
              ('## 这个分数能说明什么','## 结论边界：这个分数能说明什么'),
              ('## What a Score Can Support','## Score Boundary: What a Score Can Support'),
            ])
          for i in delta_gap_en:
            edit(ROOT/f'{i}.en.md',[
              ('## What It Follows','## Genealogy: What It Follows'),
              ('## Where It Fits in the Map','## Genealogy: Where It Fits in the Map'),
              ('## What It Still Does Not Measure','## Remaining Gap: What It Still Does Not Measure'),
            ])
          for i in gap_en:
            edit(ROOT/f'{i}.en.md',[
              ('## What It Still Does Not Measure','## Remaining Gap: What It Still Does Not Measure'),
            ])
          for i in validity_en:
            edit(ROOT/f'{i}.en.md',[
              ('## What a Score Can Support','## Score Boundary: What a Score Can Support'),
              ('## What the Score Can Support','## Score Boundary: What the Score Can Support'),
            ])
          print('changed',len(changed),changed)
          PY
      - name: Require A depth and bilingual semantic parity
        run: |
          python scripts/audit_detail_pages.py | tee /tmp/audit.txt
          grep -q 'grades: A=129, B=0, C=0, D=0' /tmp/audit.txt
          grep -q 'semantic-parity warnings: 0' /tmp/audit.txt
      - name: Validate all public surfaces
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_reading.py
          python scripts/validate_detail_pages.py
          cd web
          npm install --no-audit --no-fund
          npm test
          npm run check
          npm run build
      - name: Commit and remove one-off workflow
        run: |
          rm .github/workflows/editorial-depth-20260905.yml
          git config user.name 'Hao Zhang'
          git config user.email 'zhanghaowuda12@gmail.com'
          git add -A
          git commit -m 'content: make benchmark evidence boundaries explicit'
          git push origin HEAD:chatgpt/editorial-depth-20260905
