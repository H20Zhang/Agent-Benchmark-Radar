name: Editorial Depth 2026-09-05
on:
  push:
    branches: [chatgpt/editorial-depth-20260905]
    paths: [.github/workflows/editorial-depth-20260905.yml]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: chatgpt/editorial-depth-20260905}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Make existing benchmark-specific analysis explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          R=Path('benchmarks'); changed=[]
          def edit(p,repls):
            t=p.read_text(); old=t
            for a,b in repls:
              if a in t:t=t.replace(a,b,1)
            if t!=old:p.write_text(t);changed.append(str(p))
          for i in ['vakra','locomo-plus','dataspace','dsagentbench']:
            edit(R/f'{i}.md',[('## 实际怎样评测','## 测量对象与实际怎样评测'),('## 如何评测','## 测量对象与如何评测')])
          for i in ['agenticragtracer','wikisql','fdabench','realmem','memprobe','dsaeval','causalds','agent-memory-bench-coding','snapshot-compatibility-audit']:
            edit(R/f'{i}.md',[('## 这个分数能证明什么','## 结论边界：这个分数能证明什么'),('## 分数能说明什么','## 结论边界：分数能说明什么'),('## 这个分数能说明什么','## 结论边界：这个分数能说明什么'),('## 这个分数支持什么判断','## 结论边界：这个分数支持什么判断'),('## 分数支持什么判断','## 结论边界：分数支持什么判断')])
          for i in ['memfusebench','sp-mem','past-bench','wandr','maple','visdocagentbench','das-bench','recall-trap','commercial-tax']:
            edit(R/f'{i}.en.md',[('## What It Follows','## Genealogy: What It Follows'),('## What it follows','## Genealogy: What it follows'),('## Where It Fits in the Map','## Genealogy: Where It Fits in the Map'),('## Where it fits in the map','## Genealogy: Where it fits in the map'),('## What It Still Does Not Measure','## Remaining Gap: What It Still Does Not Measure'),('## What it still does not measure','## Remaining Gap: What it still does not measure'),('## What remains uncovered','## Remaining Gap: What remains uncovered')])
          for i in ['data-eng-bench','browsecomp-plus-cm','deltaml-bench','ai4ai-bench']:
            edit(R/f'{i}.en.md',[('## What It Still Does Not Measure','## Remaining Gap: What It Still Does Not Measure'),('## What it still does not measure','## Remaining Gap: What it still does not measure'),('## What remains uncovered','## Remaining Gap: What remains uncovered'),('## What remains unmeasured','## Remaining Gap: What remains unmeasured')])
          edit(R/'browsecomp-plus.en.md',[('## Next evaluation coordinate','## Score boundary and next evaluation coordinate')])
          print('changed',len(changed),changed)
          PY
      - name: Require A depth and bilingual semantic parity
        run: |
          python scripts/audit_detail_pages.py | tee /tmp/audit.txt
          grep -q 'grades: A=129, B=0, C=0, D=0' /tmp/audit.txt
          grep -q 'semantic-parity warnings: 0' /tmp/audit.txt
      - name: Validate all public surfaces
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_reading.py
          python scripts/validate_detail_pages.py
          cd web
          npm install --no-audit --no-fund
          npm test
          npm run check
          npm run build
      - name: Commit and remove one-off workflow
        run: |
          rm .github/workflows/editorial-depth-20260905.yml
          git config user.name 'Hao Zhang'
          git config user.email 'zhanghaowuda12@gmail.com'
          git add -A
          git commit -m 'content: make benchmark evidence boundaries explicit'
          git push origin HEAD:chatgpt/editorial-depth-20260905
