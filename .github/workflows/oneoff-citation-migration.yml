name: One-off citation migration

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  migrate:
    if: github.event.issue.title == 'trigger-benchmark-citation-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backfill citations and migrate reader contract
        run: python scripts/update_citations.py --migrate
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
      - name: Validate repository
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_reading.py
          git diff --check
      - name: Commit migration and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/oneoff-citation-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add citation counts to benchmark tables"
          git push origin HEAD:main
      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Citation migration completed and validated."
