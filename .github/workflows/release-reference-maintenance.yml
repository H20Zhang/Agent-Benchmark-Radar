name: Validate historical release references
on:
  push:
    branches: [maintenance/release-reference-2026-09-23]
    paths:
      - .github/workflows/release-reference-maintenance.yml
      - scripts/apply-release-references.py
      - scripts/render-release-references.py
      - data/release-references.json
      - tests/test_release_references.py
permissions:
  contents: write
concurrency:
  group: radar-release-reference-maintenance
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Inspect existing source-bounded result records
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          registry=json.loads(Path('data/benchmarks.json').read_text())
          for r in registry:
              p=Path('data/results')/(r['id']+'.json')
              if p.exists():
                  s=json.loads(p.read_text())
                  print('RESULT',r['id'],r['released'],json.dumps(s,ensure_ascii=False,separators=(',',':')))
          print('END_RESULTS')
          for r in registry:
              text=(Path('benchmarks')/(r['id']+'.en.md')).read_text()
              blocks=text.split('\n\n')
              selected=[b for b in blocks if re.search(r'\d',b) and re.search(r'%|score|accuracy|pass@|F1|nDCG|success|ceiling|recall|precision|saturat',b,re.I) and not b.startswith(('#','[','>','<!--'))]
              print('NOTE',r['id'],r['released'],r['artifacts'].get('paper'),json.dumps(selected,ensure_ascii=False,separators=(',',':')))
          print('END_NOTES')
          PY
      - name: Apply authored references when available
        run: |
          if [ -f scripts/apply-release-references.py ]; then
            python scripts/apply-release-references.py
          fi
          if [ -f scripts/render-release-references.py ]; then
            python scripts/render-release-references.py
            python scripts/render-release-references.py --check
          fi
      - name: Validate complete bilingual publication
        run: |
          python -m unittest discover -s tests -v
          node scripts/render-readme.mjs --check
          python scripts/validate_reading.py
          python scripts/validate_detail_pages.py
          python scripts/audit_detail_pages.py
          git diff --check
      - name: Save validated reference projections only on maintenance branch
        run: |
          git add benchmarks data docs SCHEMA.md CURATION.md tests scripts/render-release-references.py 2>/dev/null || git add benchmarks data docs SCHEMA.md CURATION.md tests
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate bilingual historical release reference blocks'
          git push origin HEAD:maintenance/release-reference-2026-09-23
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
