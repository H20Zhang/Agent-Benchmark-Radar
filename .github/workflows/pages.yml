name: Deploy Benchmark Radar Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Test web contracts
        working-directory: web
        run: npm test
      - name: Check Astro source
        working-directory: web
        run: npm run check
      - name: Build and upload Astro site
        uses: withastro/action@v6
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-public:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public browser verification tools
        run: |
          python -m pip install playwright==1.57.0 beautifulsoup4==4.14.3
          python -m playwright install --with-deps chromium
      - name: Verify public build and workflows
        run: python web/scripts/smoke-live.py --sha "$GITHUB_SHA" --output /tmp/radar-public-verification
      - name: Preserve public deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-deployment-verification
          path: /tmp/radar-public-verification
          retention-days: 7
