name: Prepare audit workspace
on:
  push:
    branches: [fix/audit-complete-20260906]
    paths: [.github/workflows/audit-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
        working-directory: web
      - name: Package tracked source and build tools only
        run: |
          mkdir -p /tmp/audit-workspace
          git archive HEAD | tar -x -C /tmp/audit-workspace
          cp -a web/node_modules /tmp/audit-workspace/web/node_modules
          cp "$(command -v node)" /tmp/audit-workspace/node-runtime
          tar -czf /tmp/audit-workspace.tar.gz -C /tmp/audit-workspace .
      - uses: actions/upload-artifact@v4
        with:
          name: audit-workspace
          path: /tmp/audit-workspace.tar.gz
          retention-days: 1
