name: One-shot README-first contract migration

on:
  push:
    paths:
      - ".github/workflows/one-shot-readme-first.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch README-first contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/validate_reading.py",
              '''            site_route = (\n                "https://h20zhang.github.io/Agent-Benchmark-Radar/"\n                f"{site_locale}/benchmarks/?area={area}"\n            )\n            if site_route not in section:\n                errors.append(f"{language}: {anchor} is missing its interactive site route")\n''',
              "",
          )

          replace_once(
              "tests/test_validate_reading.py",
              '''    def test_map_direction_and_site_route_are_validated(self):\n        mutated = self.en.replace("flowchart TB", "flowchart LR", 1).replace(\n            "https://h20zhang.github.io/Agent-Benchmark-Radar/en/benchmarks/?area=agent-memory",\n            "https://example.com/agent-memory",\n            1,\n        )\n        errors = validate_public_readme(self.zh, mutated, self.records)\n\n        self.assertTrue(any("flowchart TB" in error for error in errors), errors)\n        self.assertTrue(any("interactive site route" in error for error in errors), errors)\n''',
              '''    def test_map_direction_is_validated_without_requiring_a_site_route(self):\n        mutated = self.en.replace("flowchart TB", "flowchart LR", 1)\n        errors = validate_public_readme(self.zh, mutated, self.records)\n\n        self.assertTrue(any("flowchart TB" in error for error in errors), errors)\n        self.assertFalse(any("interactive site route" in error for error in errors), errors)\n''',
          )

          replace_once(
              "tests/test_web_contract.py",
              '''    def test_readmes_present_the_live_radar_in_the_first_screen(self):\n        for filename in ("README.md", "README.en.md"):\n            text = (ROOT / filename).read_text(encoding="utf-8")\n            with self.subTest(filename=filename):\n                self.assertIn(SITE_URL, text[:5000])\n''',
              '''    def test_readmes_keep_the_wip_website_hidden(self):\n        markers = {\n            "README.md": "网站待完善；当前内容以本 README 为准。",\n            "README.en.md": "Website under improvement; this README is the source of truth for now.",\n        }\n        for filename, marker in markers.items():\n            text = (ROOT / filename).read_text(encoding="utf-8")\n            with self.subTest(filename=filename):\n                self.assertNotIn(SITE_URL, text)\n                self.assertIn(marker, text[:5000])\n''',
          )

          replace_once(
              "tests/test_web_contract.py",
              '''        self.assertIn("data-filter-form", source)\n        self.assertIn("benchmark-timeline", source)\n        self.assertIn("tool-result-table", source)\n        self.assertIn("benchmark-at-a-glance", source)\n        self.assertIn("data-suite-builder", source)\n''',
              '''        self.assertIn("data-filter-form", source)\n        self.assertIn("wip-shell", source)\n        self.assertIn("Website under improvement", source)\n        self.assertIn('robots="noindex,nofollow"', source)\n        self.assertIn("benchmark-at-a-glance", source)\n        self.assertIn("data-suite-builder", source)\n''',
          )
          PY

      - name: Run Python contracts
        run: python -m unittest discover -s tests -v

      - name: Commit contract migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_reading.py tests/test_validate_reading.py tests/test_web_contract.py
          git commit -m "test: make README-first WIP state canonical"
          git push origin HEAD:main
